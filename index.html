<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 20px;
            transition: background 0.5s ease-in-out, color 0.5s ease-in-out;
            position: relative;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            margin: auto;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
        }
        input {
            padding: 12px;
            width: 80%;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 16px;
            margin-bottom: 10px;
            transition: all 0.3s ease-in-out;
        }
        button {
            padding: 12px 25px;
            background: #ff4e50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #fc913a;
        }
        #weather-result {
            margin-top: 20px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌤 Weather App</h2>
        <input type="text" id="location" placeholder="Enter location">
        <button onclick="getWeather()">Get Weather</button>
        <div id="weather-result"></div>
    </div>
    
    <script>
        function getWeather() {
            let location = document.getElementById("location").value;
            let apiKey = "4bf6e92a43094a56a97103001250802";
            let url = `http://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}&aqi=yes`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    let temperature = data.current.temp_c;
                    let condition = data.current.condition.text;
                    let city = data.location.name;
                    let country = data.location.country;
                    document.getElementById("weather-result").innerHTML = 
                        `<p><strong>📍 Location:</strong> ${city}, ${country}</p>
                         <p><strong>🌡 Temperature:</strong> ${temperature}°C</p>
                         <p><strong>☁ Condition:</strong> ${condition}</p>`;
                    
                    changeBackground(condition);
                })
                .catch(error => {
                    document.getElementById("weather-result").innerHTML = "Invalid location or API error.";
                });
        }
        
        function changeBackground(condition) {
            let body = document.body;
            condition = condition.toLowerCase();
            if (condition.includes("sunny")) {
                body.style.background = "linear-gradient(to right, #fbc531, #e84118)";
                body.style.color = "black";
            } else if (condition.includes("cloud")) {
                body.style.background = "linear-gradient(to right, #bdc3c7, #2c3e50)";
                body.style.color = "white";
            } else if (condition.includes("rain")) {
                body.style.background = "linear-gradient(to right, #00c6ff, #0072ff)";
                body.style.color = "white";
            } else if (condition.includes("snow")) {
                body.style.background = "linear-gradient(to right, #e6f0ff, #a1c4fd)";
                body.style.color = "black";
            } else {
                body.style.background = "linear-gradient(to right, #4facfe, #00f2fe)";
                body.style.color = "black";
            }
        }
    </script>
</body>
</html>
